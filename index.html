<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><meta name="theme-color" content="#f5f0e4"><title>Практика видимости</title>
<style>
:root{--paper:#f5f0e4;--ink:#322c26;--rust:#9c3e27;--orange:#c64b2e;--blue:#d5e4e9;--yellow:#f2dd86;--line:#ded5c6}*{box-sizing:border-box}body{margin:0;background:#85351f;color:var(--ink);font:15px/1.5 system-ui,-apple-system,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer;min-height:44px;border:0;border-radius:30px;padding:10px 18px;background:var(--rust);color:white;font-weight:600}button:hover{filter:brightness(.94)}button:focus-visible,a:focus-visible{outline:3px solid #34809b;outline-offset:3px}button.secondary{background:transparent;color:var(--rust);border:1px solid #ba9987}button.small{font-size:12px;padding:8px 12px}button.blue{background:var(--blue);color:var(--ink)}button:disabled{opacity:.6;cursor:default}h1,h2,h3,p{margin:0}h1,h2,h3{font-family:Georgia,'Times New Roman',serif;font-weight:400;line-height:1.12}h1{font-size:39px;letter-spacing:-1.5px}h2{font-size:29px;letter-spacing:-.7px}h3{font-size:23px}p{margin-top:12px}small,.muted{color:#73695e}#shell{max-width:480px;margin:0 auto;min-height:100vh;background:var(--paper);padding-bottom:100px}header{display:flex;justify-content:space-between;align-items:center;padding:23px 22px 18px;border-bottom:1px solid var(--line)}.logo{font-weight:850;font-size:21px;line-height:.9;letter-spacing:-1px;color:var(--orange)}.logo span{display:block}.date{font-size:11px;text-align:right;max-width:125px}.intro{padding:26px 22px 22px}.eyebrow{text-transform:uppercase;letter-spacing:1.7px;font-size:10px;font-weight:700;display:block;margin-bottom:12px}.intro p{font-size:13px;max-width:290px}.hero{margin:0 16px 22px;padding:23px 20px;background:repeating-linear-gradient(90deg,#d7e5e8 0,#d7e5e8 12px,#e9eee7 12px,#e9eee7 22px);border:1px solid #c4d4d6;border-radius:4px;position:relative}.hero-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.tag{background:var(--paper);border-radius:20px;padding:5px 10px;font-size:11px}.sun{display:flex;align-items:center;justify-content:center;width:60px;height:60px;background:var(--yellow);border-radius:50%;font-size:29px;color:var(--rust);transform:rotate(-12deg)}.hero h2{max-width:295px;font-size:32px}.hero p{font-size:14px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:19px}.hero .actions button:first-child{flex:1}.hero .secondary{background:var(--paper)}details{margin-top:16px;font-size:13px}summary{cursor:pointer;padding:7px 0}ol{padding-left:20px}li{margin-bottom:8px}.ticker{border-block:1px solid var(--rust);color:var(--rust);font-size:10px;text-align:center;padding:9px 6px;letter-spacing:1px}.section{padding:24px 22px 0;scroll-margin-top:15px}.heading{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:15px}.heading small{font-size:11px}.task{padding:17px 0;border-bottom:1px solid var(--line)}.task h3{font-size:21px}.task small{display:block;margin-bottom:8px}.task.done h3{color:#716f5a}.task .actions{margin-top:12px}.progress{background:var(--yellow);padding:20px;border-radius:22px;margin-top:22px}.progress-top{display:flex;justify-content:space-between;align-items:center}.progress strong{font:42px Georgia}.track{height:7px;background:#fff8d5;border-radius:20px;margin-top:16px;overflow:hidden}.track i{display:block;height:100%;background:var(--rust)}.progress p{font-size:12px}.expert{padding:23px;background:#e1e8df;border-radius:4px;border:1px solid #c2cdbf;margin-bottom:20px}.expert h2{font-size:30px}.expert p{font-size:13px}.expert .eyebrow{color:#51604c}.flower{font-size:35px;color:var(--rust);float:right}.empty{padding:18px;border:1px dashed #bda88e;border-radius:12px;font-size:13px}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,480px);background:#f5f0e4f5;backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:9px 8px calc(9px + env(safe-area-inset-bottom));z-index:3}.nav a{text-decoration:none;color:#66564a;text-align:center;font-size:10px;min-width:60px;padding:5px}.nav b{display:block;font-size:20px;line-height:1.2;color:var(--rust)}dialog{width:calc(100% - 30px);max-width:440px;border:1px solid #bda88e;border-radius:24px;padding:26px;background:var(--paper);color:var(--ink);max-height:85vh;overflow:auto}dialog::backdrop{background:#38271c88;backdrop-filter:blur(3px)}dialog h2{padding-right:25px}dialog p{font-size:14px}.close{position:absolute;right:12px;top:10px;background:none;color:var(--ink);padding:8px;font-size:24px}label{display:block;margin-top:17px;font-size:13px}input,textarea{width:100%;padding:12px;border:1px solid #bba995;background:#fffdf5;border-radius:10px;margin-top:6px;color:var(--ink)}textarea{min-height:100px}dialog .actions button{flex:1}#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);width:max-content;max-width:90%;padding:12px 20px;border-radius:16px;background:#382e26;color:white;z-index:10;font-size:13px}#toast:empty{display:none}.note{text-align:center;font-size:10px;padding:10px 24px;color:#73695e}.feedback{margin-top:12px;border-left:3px solid #c19345;padding:10px;background:#fff9df;font-size:12px}@media(min-width:600px){#shell{margin:24px auto;border-radius:8px;overflow:hidden}.nav{bottom:12px;border:1px solid var(--line);border-radius:20px;width:450px}}@media(prefers-reduced-motion:no-preference){dialog[open]{animation:appear .2s ease-out}@keyframes appear{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}}
</style><script src="https://telegram.org/js/telegram-web-app.js"></script></head>
<body><div id="shell"><header><div class="logo">практика<span>видимости ✳</span></div><div class="date" id="today"></div></header><main id="app"><section class="intro"><h1>Твой следующий<br>маленький шаг.</h1><p>Загружаем идеи для твоего личного бренда…</p></section></main><div class="note">Прототип · данные сохраняются в этом браузере.<br>Рассылка, оплата и работа с экспертом требуют подключения сервера.</div></div><nav class="nav" aria-label="Разделы"><a href="#daily"><b>✳</b>Сегодня</a><a href="#plan"><b>▤</b>План</a><a href="#favorites"><b>♡</b>Избранное</a><a href="#expert"><b>✧</b>Эксперт</a></nav><dialog id="modal"></dialog><div id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
const tg=window.Telegram?.WebApp; if(tg){tg.ready();tg.expand();}
const $=s=>document.querySelector(s), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const day=(offset=0)=>{const d=new Date();d.setDate(d.getDate()+offset);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const pretty=d=>new Date(d+'T12:00:00').toLocaleDateString('ru-RU',{day:'numeric',month:'long'});
$('#today').textContent=new Date().toLocaleDateString('ru-RU',{day:'numeric',month:'long',weekday:'long'});
let data,state,toastTimer;const key='doctor-brand-demo-v1';
function notify(t){$('#toast').textContent=t;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').textContent='',3500)}
function save(){try{localStorage.setItem(key,JSON.stringify(state))}catch{notify('Браузер не разрешил сохранение. Данные останутся до закрытия страницы.')}}
function idea(id){return data.ideas.find(x=>x.id===id)}
function button(text,action,id,cls='secondary small'){return `<button class="${cls}" data-action="${action}" data-id="${esc(id)}">${text}</button>`}
function openModal(html){$('#modal').innerHTML='<button class="close" aria-label="Закрыть" data-action="close">×</button>'+html;$('#modal').showModal()}
function render(){const daily=data.ideas[Math.floor((Date.UTC(...day().split('-').map((v,i)=>Number(v)-(i===1?1:0)))-Date.UTC(2026,0,1))/86400000)%data.ideas.length];const monday=new Date();monday.setHours(0,0,0,0);monday.setDate(monday.getDate()-((monday.getDay()+6)%7));const count=state.tasks.filter(t=>t.completedAt&&new Date(t.completedAt)>=monday).length;
$('#app').innerHTML=`<section class="intro" id="daily"><span class="eyebrow">Личный бренд врача</span><h1>Большой путь.<br>Маленькие шаги.</h1><p>Не нужно успевать всё. Сегодня достаточно одного действия.</p></section><article class="hero"><div class="hero-top"><span class="tag">Идея дня · ${daily.minutes} минут</span><span class="sun" aria-hidden="true">✳</span></div><span class="eyebrow">${esc(daily.category)}</span><h2>${esc(daily.title)}</h2><p>${esc(daily.description)}</p><details><summary>С чего начать</summary><ol>${daily.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol></details><div class="actions">${button('Добавить в план ↗','plan',daily.id,'')}${button(state.favorites.includes(daily.id)?'♥ Сохранено':'♡ В избранное','favorite',daily.id,'secondary')}</div></article><div class="ticker">В СВОЁМ ТЕМПЕ &nbsp; ✳ &nbsp; С ОПОРОЙ НА СЕБЯ &nbsp; ✳ &nbsp; КАЖДЫЙ ДЕНЬ</div><section class="section" id="plan"><div class="heading"><h2>${esc(data.plan.title)}</h2><small>${state.tasks.filter(t=>!t.completedAt).length} в работе</small></div>${state.tasks.length?state.tasks.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(taskHTML).join(''):'<div class="empty">Твой следующий шаг появится здесь. Добавь идею в план.</div>'}</section><section class="section" id="progress"><div class="progress"><span class="eyebrow">${esc(data.progress.title)} · эта неделя</span><div class="progress-top"><h3>Каждый шаг<br>имеет значение</h3><strong>${count}<small style="font:18px Georgia"> / ${data.progress.weeklyGoal}</small></strong></div><div class="track"><i style="width:${Math.min(100,count/data.progress.weeklyGoal*100)}%"></i></div><p>${count?'Ты уже создаёшь свой личный бренд. Продолжай!':'Отметь первую выполненную задачу — и увидишь свой прогресс.'}</p></div></section><section class="section" id="favorites"><div class="heading"><h2>${esc(data.favorites.title)}</h2><small>На потом · ${state.favorites.length}</small></div>${state.favorites.length?state.favorites.map(id=>{const i=idea(id);return `<article class="task"><small>${esc(i.category)} · ${i.minutes} мин</small><h3>${esc(i.title)}</h3><div class="actions">${button('В план ↗','plan',id)}${button('Убрать ♥','favorite',id)}</div></article>`}).join(''):'<div class="empty">Сохраняй идеи, к которым хочешь вернуться.</div>'}<details><summary>Ещё идеи для твоего бренда</summary>${data.ideas.map(i=>`<article class="task"><h3>${esc(i.title)}</h3><p>${esc(i.description)}</p><div class="actions">${button('В план','plan',i.id)}${button(state.favorites.includes(i.id)?'♥ Сохранено':'♡ Сохранить','favorite',i.id)}</div></article>`).join('')}</details></section><section class="section" id="expert"><article class="expert"><span class="flower">✧</span><span class="eyebrow">Сопровождение · подписка</span><h2>${esc(data.mentorship.title)}</h2><p>${esc(data.mentorship.description)}</p><div class="actions">${button(state.subscribed?'Условия демоподписки':'Узнать о сопровождении ↗','subscribe','','')}</div><p class="muted">${state.subscribed?'Демоподписка активна · без списаний':esc(data.mentorship.priceLabel)}</p></article></section>`}
function taskHTML(t){const i=idea(t.ideaId);return `<article class="task ${t.completedAt?'done':''}"><small>${t.completedAt?'✓ Выполнено':pretty(t.date)} · ${i.minutes} мин</small><h3>${esc(i.title)}</h3><div class="actions">${t.completedAt?button('Отменить отметку','undo',t.id)+button(t.review?'Посмотреть разбор':'Отправить на разбор','review',t.id,'blue small'):button('✓ Выполнено','done',t.id,'small')+button('В календарь','calendar',t.id)+button('Дата','reschedule',t.id)+button('Убрать','remove',t.id)}</div>${t.review?'<p class="muted" style="font-size:12px">Деморазбор сохранён</p>':''}</article>`}
function planForm(id,taskId){const task=state.tasks.find(t=>t.id===taskId);openModal(`<span class="eyebrow">Один шаг ближе</span><h2>${task?'Перенести задачу':'Добавить в план'}</h2><p>${esc(idea(id).title)}</p><form id="planform"><label>Когда займёшься этим?<input type="date" id="date" value="${task?.date||day()}" required></label><div class="actions"><button>Сохранить в плане</button></div></form>`);$('#planform').onsubmit=e=>{e.preventDefault();const date=$('#date').value;if(!/^\d{4}-\d{2}-\d{2}$/.test(date))return;if(task)task.date=date;else state.tasks.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),ideaId:id,date,completedAt:null});save();$('#modal').close();render();notify('Задача сохранена в плане')}}
function calendar(t){const i=idea(t.ideaId);const next=new Date(t.date+'T12:00:00');next.setDate(next.getDate()+1);const end=`${next.getFullYear()}${String(next.getMonth()+1).padStart(2,'0')}${String(next.getDate()).padStart(2,'0')}`;const clean=s=>s.replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;');const lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Doctor Brand//RU','CALSCALE:GREGORIAN','BEGIN:VEVENT','UID:'+t.id+'@doctor-brand.demo','DTSTAMP:'+new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,''),'DTSTART;VALUE=DATE:'+t.date.replaceAll('-',''),'DTEND;VALUE=DATE:'+end,'SUMMARY:'+clean(i.title),'DESCRIPTION:'+clean(i.description),'END:VEVENT','END:VCALENDAR'];const fold=line=>{let result='',n=0;for(const ch of line){const size=new TextEncoder().encode(ch).length;if(n+size>73){result+='\r\n ';n=1}result+=ch;n+=size}return result};const blob=new Blob([lines.map(fold).join('\r\n')+'\r\n'],{type:'text/calendar;charset=utf-8'});const url=URL.createObjectURL(blob);openModal('<span class="eyebrow">Календарь телефона</span><h2>Сохрани время для себя</h2><p>Скачай событие и открой файл в календаре телефона. Подтверди добавление. Это событие на весь день, без автоматической синхронизации.</p><p><a id="ics" download="brand-task.ics">Скачать событие .ics ↗</a></p><p class="muted">Если Telegram не открывает файл, открой приложение во внешнем браузере.</p>');$('#ics').href=url;$('#modal').addEventListener('close',()=>URL.revokeObjectURL(url),{once:true})}
function subscribe(){openModal(`<span class="eyebrow">Подписка на сопровождение</span><h2>Твой взгляд +<br>взгляд эксперта</h2><ul>${data.mentorship.features.map(f=>`<li>${esc(f)}</li>`).join('')}</ul><p>${esc(data.mentorship.priceLabel)}.</p><p class="muted">В прототипе можно попробовать сценарий бесплатно. Оплата не подключена, настоящий маркетолог не получает материалы.</p><div class="actions">${button(state.subscribed?'Отключить демоподписку':'Попробовать демоподписку','toggle-sub','','')}</div>`)}
function review(t){if(!state.subscribed){subscribe();return}openModal(`<span class="eyebrow">Обратная связь · демо</span><h2>${t.review?'Твой разбор':'Покажи свой результат'}</h2><p>${esc(idea(t.ideaId).title)}</p>${t.review?`<p>${esc(t.review)}</p><div class="feedback">${esc(data.mentorship.demoFeedback)}<p><strong>Это пример ответа, не разбор реального эксперта.</strong></p></div>`:`<form id="reviewform"><label>Ссылка на публикацию (необязательно)<input type="url" id="link" placeholder="https://…"></label><label>Что удалось и о чём хочешь спросить?<textarea id="result" maxlength="2000" required placeholder="Опиши результат и свой вопрос"></textarea></label><p class="muted">Не добавляй данные пациентов. Материал сохранится только в этом браузере.</p><div class="actions"><button>Получить пример разбора</button></div></form>`}`);if(!t.review)$('#reviewform').onsubmit=e=>{e.preventDefault();const result=$('#result').value.trim();if(!result){$('#result').setCustomValidity('Напиши несколько слов о результате');$('#result').reportValidity();$('#result').oninput=()=>$('#result').setCustomValidity('');return}t.review=result+($('#link').value?'\n'+$('#link').value:'');save();render();$('#modal').close();review(t)}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const id=b.dataset.id,t=state?.tasks.find(t=>t.id===id);switch(b.dataset.action){case'close':$('#modal').close();break;case'favorite':state.favorites=state.favorites.includes(id)?state.favorites.filter(x=>x!==id):[...state.favorites,id];save();render();break;case'plan':planForm(id);break;case'reschedule':planForm(t.ideaId,t.id);break;case'done':t.completedAt=new Date().toISOString();save();render();openModal(`<span class="sun" style="margin-bottom:20px">✳</span><span class="eyebrow">${esc(data.project.creator)}</span><h2>${esc(data.project.praise)}</h2><p>Ещё один шаг для твоего личного бренда сделан. Заметь свой успех.</p><div class="actions">${button('Спасибо, продолжаю','close','','')}</div>`);break;case'undo':t.completedAt=null;save();render();break;case'remove':state.tasks=state.tasks.filter(x=>x.id!==id);save();render();notify('Задача убрана из плана');break;case'calendar':calendar(t);break;case'subscribe':subscribe();break;case'toggle-sub':state.subscribed=!state.subscribed;save();render();$('#modal').close();notify(state.subscribed?'Демоподписка включена. Открой выполненную задачу.':'Демоподписка отключена');break;case'review':review(t);break;case'choose-data':chooseData();break;case'retry':init();break}});
async function init(imported){try{if(imported){data=imported}else{const response=await fetch('data.json?v='+Date.now(),{cache:'no-store'});if(!response.ok)throw Error('load');data=await response.json();}if(!data.ideas?.length||!data.plan||!data.favorites||!data.progress||!data.mentorship)throw Error('schema');state=null;try{const old=JSON.parse(localStorage.getItem(key));if(old&&Array.isArray(old.tasks)&&Array.isArray(old.favorites)){old.tasks=old.tasks.filter(t=>idea(t.ideaId)&&typeof t.id==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(t.date));old.favorites=old.favorites.filter(id=>idea(id));state=old}}catch{}if(!state)state={favorites:[...data.favorites.initialIds],tasks:data.plan.initialTasks.map((t,n)=>({id:'initial-'+n,ideaId:t.ideaId,date:day(t.dayOffset),completedAt:null})),subscribed:false};render()}catch{$('#app').innerHTML='<section class="intro"><span class="eyebrow">Небольшая пауза</span><h1>Идеи пока<br>не загрузились.</h1><p>Если ты открыла HTML как обычный файл, браузер не разрешает автоматически прочитать данные рядом с ним. Выбери data.json вручную — и прототип откроется.</p><div class="actions"><button data-action="choose-data">Выбрать data.json</button><button class="secondary" data-action="retry">Повторить загрузку</button></div></section>'}}
function chooseData(){const input=document.createElement('input');input.type='file';input.accept='.json,application/json';input.onchange=async()=>{const file=input.files[0];if(!file)return;try{const imported=JSON.parse(await file.text());if(!Array.isArray(imported.ideas)||!imported.ideas.length||!imported.project||!imported.plan||!imported.favorites||!imported.progress||!imported.mentorship)throw Error('schema');await init(imported)}catch{notify('Не удалось прочитать данные. Выбери исходный файл data.json.')}};input.click()}
init();
</script></body></html>
